    "fourLayerNotes": "好的，作为专业的读书笔记生成助手，我将根据您提供的《皮》节选内容，严格按照您指定的四层结构生成一份详尽的读书笔记。\n\n# 《皮》- 四层笔记\n\n## 第一层：基础信息\n- **书名**：皮\n- **作者**：库尔齐奥·马拉巴特（Curzio Malaparte）\n- **核心主题**：本书通过二战末期盟军占领下的那不勒斯这一微观宇宙，深刻剖析了“胜利”与“失败”的荒诞本质。作者以残酷的诗意和冷峻的观察，揭示了战争如何剥去文明的“皮肤”，暴露出人性在生存与尊严、权力与屈辱之间的极端扭曲与挣扎，最终指向一个核心悖论：胜利者与失败者，在道德的废墟上，都是被战争“吞噬”的受害者。\n- **适合人群**：\n    - 对二战历史，尤其是意大利战场和盟军占领区社会生态感兴趣的读者。\n    - 喜欢文学性、哲学性强的战争反思作品，而非单纯军事史的读者。\n    - 对人性在极端环境下的异化与挣扎有探究欲望的读者。\n    - 能够接受并思考残酷、讽刺甚至令人不适的叙事风格的读者。\n\n## 第二层：核心内容总结\n\n**要点1：失败者的荒诞境遇与被剥夺的尊严**\n- **详细解释**：书中开篇即描绘了那不勒斯人“庆祝解放”的奇异景象。他们并非作为胜利者，而是以“失败者”的身份接受“解放”这一荣誉。作者指出，“输掉战争比赢得一场战争更加困难”，那不勒斯人陷入了一种身份悖论：他们既不觉得自己是自由人，也不承认自己是失败者。更荒诞的是，意大利解放军的士兵被迫穿上从阵亡英军士兵身上扒下的、带着血迹和弹孔的军装。这不仅是物资匮乏的体现，更是一种象征性的“剥皮”——他们的身份、尊严和过去都被剥夺，穿上了敌人的“皮”，成为了一个被定义、被羞辱的存在。作者马拉巴特自己也穿着这样的军装，并发现鞋里有一枚钉子，这个细节象征着失败者所承受的、持续不断的微小而具体的痛苦。\n\n**要点2：人性商品化与道德秩序的崩塌**\n- **详细解释**：在那不勒斯的街头，一切都可以被标价，尤其是“人肉”。作者以近乎冷血的商业口吻，描述了人肉市场的经济规律：女孩和男孩被明码标价（“男孩两美元，女孩三美元”），其价格甚至低于羔羊肉；价格波动受供需影响，来自西西里和南部地区的“新鲜肉”涌入导致价格下跌，而“黑人”士兵的价值却在上涨。这种赤裸裸的比喻，将战争带来的道德真空展露无遗。当生存成为唯一目标时，人的身体、性别、年龄甚至种族都变成了可交易的商品，传统的伦理、亲情和羞耻感在饥饿和绝望面前彻底崩塌。作者通过这种冰冷的经济学分析，揭示了战争如何将人彻底物化。\n\n**要点3：胜利者的“纯洁”与“无辜”之恶**\n- **详细解释**：作者对美国人，尤其是他的朋友杰克·汉密尔顿上校，怀有复杂的情感。他称赞美国人是“世界上最可爱、最和气、最值得尊敬的军队”，赞赏他们的“善良与无辜”。然而，这种“善良”恰恰是问题所在。作者认为，美国人相信“基督总是站在有道理的人一边”，相信“失败是一种道德上的刑罚”。这种基于绝对善恶观的道德优越感，使得他们无法理解失败者的复杂处境和痛苦。他们以一种“纯洁”的、近乎宗教审判的眼光看待战败的民族，其“慷慨”和“人文意识”无形中加深了失败者的屈辱。杰克随口说出的“这些肮脏的杂种”，正是这种不自觉的、居高临下的“纯洁之恶”的体现。\n\n**要点4：感官化的战争体验与“皮”的象征**\n- **详细解释**：马拉巴特的叙事高度感官化。他描绘那不勒斯空气中混杂的“上千种微妙的臭气”——油炸食品、腐烂的花、尿液、西洛可风带来的鱼腥和羊膻味，以及萨特所闻到的“爱情和食物之间那种不洁的亲属关系”。这些气味构成了战争背景下那不勒斯独特的“氛围”，它黏稠、污秽、令人窒息。而“皮”这个书名，既是隐喻也是具象：它指代被剥下的军装（敌人的皮）、被交易的人肉（商品化的皮）、被炸毁的房屋（城市的皮），更象征着文明、尊严、道德这层覆盖在人性之上的“皮肤”。战争如同一种“瘟疫”（第一章标题），正在剥去这层皮，让底下赤裸的、腐烂的、蠕动的真实暴露出来。\n\n## 第三层：深度洞察与跨学科联系\n\n**洞察1：与存在主义哲学的对话（萨特、加缪）**\n- **联系**：书中萨特对那不勒斯气味的评论，以及马拉巴特对个体在荒诞境遇中挣扎的描写，与存在主义哲学的核心命题高度契合。那不勒斯人的处境——“既不自由，也不失败”——正是存在主义所探讨的“被抛入世界”的荒诞状态。他们被赋予“失败者”的身份（一种“本质”），却无法认同这种本质，从而陷入“存在先于本质”的挣扎。与加缪的《鼠疫》呼应，“瘟疫”不仅是疾病，更是战争和极权主义对人性的侵蚀。马拉巴特笔下那不勒斯的道德沦丧，正是这种“瘟疫”蔓延下的集体性荒诞。\n\n**洞察2：后殖民主义视角下的权力关系**\n- **联系**：书中对盟军（尤其是美军）与那不勒斯人、黑人士兵与白人妓女、殖民军队（摩洛哥人、阿尔及利亚人等）与当地人的关系描写，构成了一幅复杂的权力图谱。胜利者不仅是军事上的征服者，更是文化、经济和道德上的“审判者”。他们用“解放”的名义，建立了一套新的等级秩序。黑人士兵作为“解放者”的一员，却仍处于种族歧视的阴影下（“黑人不喜欢肤色太黑的白种女人”的评论揭示了殖民心态）。这种内部嵌套的权力结构，是后殖民理论中“他者”建构和“文化霸权”的绝佳文学例证。那不勒斯人被迫扮演“失败者”的角色，正是被胜利者的话语权所定义。\n\n**洞察3：创伤心理学中的“幸存者愧疚”与“身份解体”**\n- **联系**：马拉巴特和意大利士兵穿上死人的军装，这一意象完美诠释了创伤心理学中的“幸存者愧疚”和“身份解体”。他们活下来了，但必须背负着逝者的“皮囊”继续前行，这导致他们无法与过去和解，也无法建立新的、完整的自我认同。作者在第一章结尾的幻觉——看到所有士兵，甚至上校都“已经死了”——正是这种心理创伤的具象化表现。他们虽生犹死，成为了“行走的尸体”。这种状态比直接的死亡更令人恐惧，因为它摧毁了人的主体性和意义感。\n\n## 第四层：个人思考与应用\n\n**行动建议1：警惕“胜利者叙事”的单一性与傲慢**\n- **应用**：在日常生活中，无论是工作、学习还是人际关系中，我们常常不自觉地扮演“胜利者”的角色，并习惯用自己认为对的标准去评判他人。阅读《皮》提醒我们，任何“胜利”都可能伴随着对“失败者”复杂境遇的简化与忽视。在争论或冲突后，尝试从对方（“失败者”）的视角理解其行为的合理性，避免用道德优越感去碾压他人。这不仅是一种宽容，更是一种深刻的理解力。\n\n**行动建议2：反思物质主义对“人”的物化**\n- **应用**：书中人肉市场的描写虽然极端，却是现代社会“物化”现象的放大镜。在消费主义社会，我们是否也在用价格、学历、外貌、地位等标签来衡量他人和自己？行动上，可以有意识地减少对他人“使用价值”（如人脉、资源）的评估，更多地关注其作为“人”的内在价值。在面对自己时，警惕将自我价值完全等同于收入和成就，学会欣赏自己“存在”本身的价值。\n\n**行动建议3：培养对“苦难”的复杂感知力**\n- **应用**：书中那不勒斯人既唱歌又哭泣，既热情又麻木，这种复杂的情感状态是真实人性的反映。我们往往倾向于将“受害者”简单化为纯洁无辜或堕落可恨。行动上，可以尝试阅读更多类似《皮》这样的、不提供简单道德答案的战争或灾难文学。在看待社会新闻中的弱势群体时，避免立刻下结论（“他们活该”或“他们太可怜”），而是尝试去理解其在极端环境下的生存逻辑与道德困境。\n\n**行动建议4：审视“纯洁”与“善良”可能带来的伤害**\n- **应用**：杰克·汉密尔顿的“善良”与“无辜”在书中成为一种无意识的暴力。这启示我们，自以为是的“好心”和“正义感”如果不加反思，也可能对他人造成伤害。行动上，在帮助他人或表达善意时，先询问对方的真实需求，而不是按照自己的想法“给予”。特别是在跨文化或权力不对等的关系中，放下“救世主”心态，保持谦卑和倾听，是避免“纯洁之恶”"

    "fourLayerNotes": "# 《11/22/63》- 四层笔记\n\n## 第一层：基础信息\n- **书名**：11/22/63\n- **作者**：(美)斯蒂芬·金\n- **核心主题**：通过一位普通教师穿越时空试图阻止肯尼迪遇刺的故事，探讨命运、因果与选择的不可逆性，以及过去是否真的值得被改变。\n- **适合人群**：喜欢历史悬疑、时间旅行题材的读者；对肯尼迪遇刺案有好奇心的历史爱好者；以及任何思考“如果我能回到过去改变一件事”这一命题的人。\n\n## 第二层：核心内容总结\n\n**要点1：时间旅行并非童话，过去有强大的“纠错”机制**\n书中通过阿尔·坦普尔顿的发现揭示：时间旅行是可能的，但过去并不愿意被改变。当主角杰克·埃平试图改变历史时，他会遭遇各种阻力——从身体不适到意外事件，仿佛时间本身在抵抗。阿尔本人因多次穿越而迅速衰老、生病，说明干预过去需要付出巨大的个人代价。\n\n**要点2：普通人也能成为历史的见证者与干预者**\n杰克·埃平并非英雄或学者，他只是一个离异、情感内敛的高中英语教师。他的平凡性恰恰是故事的核心：历史不是由伟人独自书写的，而是由无数普通人的选择与行动共同塑造。他因一篇学生作文（守门人哈里·邓宁关于父亲杀全家的真实经历）而流泪，这眼泪最终促使他同意参与穿越计划。\n\n**要点3：情感阻滞并非无情，而是另一种深沉的感知方式**\n杰克的前妻指责他“缺乏情感梯度”，但书中通过他对哈里作文的哭泣、对父母去世的私下哀悼，以及最终面对改变历史后果时的挣扎，证明情感可以深沉而私密。真正的勇气不是没有恐惧或悲伤，而是在感受一切后依然选择行动。\n\n**要点4：过去是“有机体”，改变它可能带来更坏的后果**\n阿尔警告杰克：“过去是固执的，它不想被改变。”书中暗示，即使成功阻止肯尼迪遇刺，也可能引发连锁反应——比如更糟糕的冷战结局或社会动荡。这呼应了“蝴蝶效应”理论：微小的改变可能在时空中放大为灾难。\n\n**要点5：时间旅行的终点不是拯救世界，而是拯救一个具体的人**\n杰克最初的目标是阻止肯尼迪遇刺，但在穿越过程中，他逐渐发现真正驱动他的是拯救他人——尤其是他深爱的萨迪·邓希尔，以及那个写出震撼作文的守门人哈里·邓宁。最终，他不得不面对一个残酷的选择：改变历史拯救一个人，还是让历史保持原样。\n\n## 第三层：深度洞察与跨学科联系\n\n**洞察1：心理学视角——情感记忆与创伤的“时间性”**\n杰克对哈里作文的强烈反应，揭示了一个心理学现象：创伤记忆往往以非线性的方式影响人。哈里的作文不是简单的叙述，而是通过细节（“血涌向喉咙”、“我喜欢她摘花”）重建了情感现场，这种“情感真实”比客观事实更能触动他人。这也解释了为什么杰克愿意为这个陌生人冒险：因为哈里的故事激活了他自己压抑的情感记忆。\n\n**洞察2：历史学与哲学——偶然性与必然性的边界**\n书中反复出现的主题是“人生就像一枚不停转动的硬币”，强调历史的偶然性。但另一方面，阿尔和杰克都发现，某些事件似乎“注定”会发生（如肯尼迪遇刺）。这引发了哲学思考：历史是无数偶然性的随机碰撞，还是存在某种隐含的必然结构？斯蒂芬·金没有给出答案，但通过杰克的旅程，他让读者亲身体验这种张力。\n\n**洞察3：社会学视角——普通人的历史力量**\n传统历史叙事常聚焦于总统、将军等大人物，但本书强调：守门人、教师、餐馆老板——这些“小人物”的日常选择同样在塑造历史。哈里·邓宁的作文不仅改变了杰克的人生，还间接影响了时间旅行的走向。这提醒我们，历史不是由英雄独白构成的，而是由无数个“杰克”和“哈里”的对话与行动编织而成。\n\n## 第四层：个人思考与应用\n\n**行动建议1：记录并珍视“改变你生活的一天”**\n杰克通过批改学生作文而人生转折。建议读者定期（如每月一次）写下“改变我生活的一天”，哪怕只是微小的事件。这不仅能训练观察力，还能帮助你发现自己生命中的“分水岭时刻”，从而更主动地把握人生方向。\n\n**行动建议2：练习“情感诚实”而非“情感宣泄”**\n杰克的前妻误解了他的情感表达方式。书中启示：情感的价值不在于是否公开流泪，而在于是否真实面对。可以尝试：当感到悲伤或愤怒时，先问自己“我真正感受到的是什么？”而不是立即反应。这种内在的诚实往往比外在的宣泄更有力量。\n\n**行动建议3：在“改变过去”的幻想中寻找现实启示**\n与其幻想回到过去改变某个事件，不如问自己：“如果我现在能回到五年前，我会对当时的自己说什么？”然后把这个建议转化为当下的行动。例如，如果你后悔没学某门技能，现在就开始学；如果你后悔伤害了某人，现在就去道歉。时间旅行是幻想，但“现在改变”是可能的。\n\n**行动建议4：关注“边缘人”的故事**\n书中守门人哈里·邓宁、餐馆老板阿尔都是社会边缘人，但他们的故事却成为历史的关键节点。建议读者有意识地接触那些被主流忽视的人群——清洁工、保安、小店主——倾听他们的经历。你可能会发现，这些看似平凡的人生中藏着惊人的智慧或悲剧，而你的倾听本身可能就是一种改变。\n\n**思考方向：如果只能改变一件事，你会选什么？**\n本书的核心命题是：即使有能力改变历史，你也必须面对不可预测的后果。建议读者认真思考这个思想实验：如果你有一张“时间旅行票”，只能改变人生中某个具体事件（比如阻止一次争吵、挽救一个亲人），你愿意承担多大的风险？这个问题的答案，可能比任何时间旅行理论都更能揭示你真正的价值观。"

    "summary": "《运动改造大脑》的核心医学观点在于：运动不仅是强健体魄的手段，更是优化大脑功能、改善心理健康的根本性工具。作者约翰·瑞迪基于神经科学前沿研究提出，运动能够通过增加关键神经递质（如血清素、去甲肾上腺素、多巴胺）和促进神经生长因子（如IGF-1、VEGF）的释放，直接改变大脑的结构与功能。这些变化不仅能提升学习能力和情绪稳定性，还能有效预防和辅助治疗包括抑郁症、焦虑症、注意力缺陷障碍（ADHD）、成瘾行为以及阿尔茨海默病在内的多种认知与精神障碍。运动对学习的生物学机制：书中详细阐述了运动如何促进“脑细胞肥料”——即脑源性神经营养因子（BDNF）的产生。运动对抗压力与焦虑：作者指出，压力本身并不可怕",

    "fourLayerNotes": "# 《11/22/63》- 四层笔记\n\n## 第一层：基础信息\n- **书名**：11/22/63\n- **作者**：(美)斯蒂芬·金\n- **核心主题**：通过一位普通教师穿越时空试图阻止肯尼迪遇刺的故事，探讨命运、因果与选择的不可逆性，以及过去是否真的值得被改变。\n- **适合人群**：喜欢历史悬疑、时间旅行题材的读者；对肯尼迪遇刺案有好奇心的历史爱好者；以及任何思考“如果我能回到过去改变一件事”这一命题的人。\n\n## 第二层：核心内容总结\n\n**要点1：时间旅行并非童话，过去有强大的“纠错”机制**\n书中通过阿尔·坦普尔顿的发现揭示：时间旅行是可能的，但过去并不愿意被改变。当主角杰克·埃平试图改变历史时，他会遭遇各种阻力——从身体不适到意外事件，仿佛时间本身在抵抗。阿尔本人因多次穿越而迅速衰老、生病，说明干预过去需要付出巨大的个人代价。\n\n**要点2：普通人也能成为历史的见证者与干预者**\n杰克·埃平并非英雄或学者，他只是一个离异、情感内敛的高中英语教师。他的平凡性恰恰是故事的核心：历史不是由伟人独自书写的，而是由无数普通人的选择与行动共同塑造。他因一篇学生作文（守门人哈里·邓宁关于父亲杀全家的真实经历）而流泪，这眼泪最终促使他同意参与穿越计划。\n\n**要点3：情感阻滞并非无情，而是另一种深沉的感知方式**\n杰克的前妻指责他“缺乏情感梯度”，但书中通过他对哈里作文的哭泣、对父母去世的私下哀悼，以及最终面对改变历史后果时的挣扎，证明情感可以深沉而私密。真正的勇气不是没有恐惧或悲伤，而是在感受一切后依然选择行动。\n\n**要点4：过去是“有机体”，改变它可能带来更坏的后果**\n阿尔警告杰克：“过去是固执的，它不想被改变。”书中暗示，即使成功阻止肯尼迪遇刺，也可能引发连锁反应——比如更糟糕的冷战结局或社会动荡。这呼应了“蝴蝶效应”理论：微小的改变可能在时空中放大为灾难。\n\n**要点5：时间旅行的终点不是拯救世界，而是拯救一个具体的人**\n杰克最初的目标是阻止肯尼迪遇刺，但在穿越过程中，他逐渐发现真正驱动他的是拯救他人——尤其是他深爱的萨迪·邓希尔，以及那个写出震撼作文的守门人哈里·邓宁。最终，他不得不面对一个残酷的选择：改变历史拯救一个人，还是让历史保持原样。\n\n## 第三层：深度洞察与跨学科联系\n\n**洞察1：心理学视角——情感记忆与创伤的“时间性”**\n杰克对哈里作文的强烈反应，揭示了一个心理学现象：创伤记忆往往以非线性的方式影响人。哈里的作文不是简单的叙述，而是通过细节（“血涌向喉咙”、“我喜欢她摘花”）重建了情感现场，这种“情感真实”比客观事实更能触动他人。这也解释了为什么杰克愿意为这个陌生人冒险：因为哈里的故事激活了他自己压抑的情感记忆。\n\n**洞察2：历史学与哲学——偶然性与必然性的边界**\n书中反复出现的主题是“人生就像一枚不停转动的硬币”，强调历史的偶然性。但另一方面，阿尔和杰克都发现，某些事件似乎“注定”会发生（如肯尼迪遇刺）。这引发了哲学思考：历史是无数偶然性的随机碰撞，还是存在某种隐含的必然结构？斯蒂芬·金没有给出答案，但通过杰克的旅程，他让读者亲身体验这种张力。\n\n**洞察3：社会学视角——普通人的历史力量**\n传统历史叙事常聚焦于总统、将军等大人物，但本书强调：守门人、教师、餐馆老板——这些“小人物”的日常选择同样在塑造历史。哈里·邓宁的作文不仅改变了杰克的人生，还间接影响了时间旅行的走向。这提醒我们，历史不是由英雄独白构成的，而是由无数个“杰克”和“哈里”的对话与行动编织而成。\n\n## 第四层：个人思考与应用\n\n**行动建议1：记录并珍视“改变你生活的一天”**\n杰克通过批改学生作文而人生转折。建议读者定期（如每月一次）写下“改变我生活的一天”，哪怕只是微小的事件。这不仅能训练观察力，还能帮助你发现自己生命中的“分水岭时刻”，从而更主动地把握人生方向。\n\n**行动建议2：练习“情感诚实”而非“情感宣泄”**\n杰克的前妻误解了他的情感表达方式。书中启示：情感的价值不在于是否公开流泪，而在于是否真实面对。可以尝试：当感到悲伤或愤怒时，先问自己“我真正感受到的是什么？”而不是立即反应。这种内在的诚实往往比外在的宣泄更有力量。\n\n**行动建议3：在“改变过去”的幻想中寻找现实启示**\n与其幻想回到过去改变某个事件，不如问自己：“如果我现在能回到五年前，我会对当时的自己说什么？”然后把这个建议转化为当下的行动。例如，如果你后悔没学某门技能，现在就开始学；如果你后悔伤害了某人，现在就去道歉。时间旅行是幻想，但“现在改变”是可能的。\n\n**行动建议4：关注“边缘人”的故事**\n书中守门人哈里·邓宁、餐馆老板阿尔都是社会边缘人，但他们的故事却成为历史的关键节点。建议读者有意识地接触那些被主流忽视的人群——清洁工、保安、小店主——倾听他们的经历。你可能会发现，这些看似平凡的人生中藏着惊人的智慧或悲剧，而你的倾听本身可能就是一种改变。\n\n**思考方向：如果只能改变一件事，你会选什么？**\n本书的核心命题是：即使有能力改变历史，你也必须面对不可预测的后果。建议读者认真思考这个思想实验：如果你有一张“时间旅行票”，只能改变人生中某个具体事件（比如阻止一次争吵、挽救一个亲人），你愿意承担多大的风险？这个问题的答案，可能比任何时间旅行理论都更能揭示你真正的价值观。"

    "summary": "核心主题：本书通过讲述神经科学史上最著名的遗忘症患者H.M.（亨利·莫莱森）的故事，以及作者外祖父、为H.M.进行脑部手术的神经外科医生威廉·比彻·斯科维尔的角色，深刻探讨了记忆的生物学基础、科学研究的伦理代价，以及个人与家族历史如何塑造我们对“自我”的认知。适合人群：对神经科学、医学史、心理学感兴趣的读者；关注医学伦理与人性困境的思考者；喜欢融合个人家族史与宏大科学叙事的非虚构作品爱好者。要点1：H.M.的悲剧是理解记忆科学的起点。为了治疗他的癫痫，作者的外祖父威廉·比彻·斯科维尔医生在1953年为他实施了一次实验性的脑部手术，切除了大脑中被称为“内侧颞叶”的深层结构，包括大部分海马体。书中",

    "fourLayerNotes": "好的，这是根据您提供的《世界观：现代人必须要懂的科学哲学和科学史（原书第2版）》节选内容，严格按照四层结构生成的读书笔记。\n\n# 《世界观：现代人必须要懂的科学哲学和科学史（原书第2版）》- 四层笔记\n\n## 第一层：基础信息\n- **书名**：世界观：现代人必须要懂的科学哲学和科学史（原书第2版）\n- **作者**：理查德·德威特（Richard DeWitt）\n- **核心主题**：本书旨在通过介绍科学哲学的基础命题和科学史（尤其是从亚里士多德世界观到牛顿世界观，再到相对论、量子理论和演化论的转变），揭示“世界观”作为相互联结的观点体系如何形成、稳固和发生根本性变革。\n- **适合人群**：对科学史和科学哲学感兴趣的初学者；希望理解“科学革命”本质、知识体系如何运作的读者；以及想要反思自身习以为常的“常识”是否可靠的思考者。\n\n## 第二层：核心内容总结\n\n**要点1：世界观的核心是“相互联结的观点拼图”**\n本书开篇即定义了“世界观”的核心概念：它不是一个简单的观点集合（像购物清单），而是一个内部相互关联、环环相扣的体系（像一幅拼图）。每个观点都不是孤立的，而是与其周围的观点紧密相连。例如，在亚里士多德世界观中，“地球是宇宙中心”这个核心观点，与“土元素天然向宇宙中心运动”、“地球主要由土元素构成”、“大的物体在没有外力时会保持静止”等观点完美地拼合在一起，形成了一个自洽的体系。这个比喻是理解全书所有历史变迁和哲学争论的基础。\n\n**要点2：区分“经验事实”与“哲学性/概念性事实”**\n作者强调，我们通常认为的“事实”可以分为两类。一类是“经验事实”，即通过直接观察或实验可以相对直接地确定的事实（比如“木星有卫星”）。另一类是“哲学性/概念性事实”，这些事实并非直接来自观察，而是基于我们更广泛的世界观、核心信念或逻辑推理得出的，在我们看来是“显而易见”的（比如在亚里士多德世界观里，“地球是静止的”就是一个哲学性/概念性事实）。书中指出，许多科学革命（如哥白尼革命）的核心，正是推翻了当时人们视为“经验事实”的“哲学性/概念性事实”。\n\n**要点3：科学定律与理论的“工具主义”与“现实主义”之争**\n书中介绍了看待科学理论的两种基本态度。**现实主义**认为，一个好的科学理论（如牛顿的万有引力定律）应该是对世界真实存在和运作方式的准确描述，其核心概念（如“引力”）应该真实存在。**工具主义**则认为，理论只是一个有用的工具或计算模型，其价值在于能否准确预测和解释现象，而不需要承诺其核心概念的真实性。作者用牛顿本人对“重力”的态度为例——牛顿认为重力作为一个真实存在的力是“荒谬的”，他对其采取的是工具主义态度，这颠覆了许多人从小接受的“牛顿力学描述的是真实世界”的认知。\n\n**要点4：奎因-迪昂论点与“不可证伪”的复杂性**\n书中介绍了奎因-迪昂论点，即我们的观点（假设）不是孤立地面对经验检验的。当一个预测失败时，我们无法唯一地判断是哪个具体假设错了，因为整个理论体系（包括辅助假设、初始条件等）都在共同面对检验。这与波普尔的“可证伪性”原则形成对比。作者指出，一个看似“被证伪”的理论（如托勒密体系），可以通过调整辅助假设（如增加本轮）来继续“拯救现象”，使其实际上变得难以被彻底证伪。这揭示了科学检验的复杂性和理论选择的非唯一性。\n\n## 第三层：深度洞察与跨学科联系\n\n**洞察1：世界观是认知的“认知模式”与“认知惯性”**\n本书提出的“世界观拼图”概念，可以与心理学中的“认知模式”或“图式”理论完美对话。我们的大脑倾向于构建一个连贯、自洽的解释框架（世界观），一旦这个框架形成，它就会像一副有色眼镜，过滤和解释所有新信息。书中提到的“哲学性/概念性事实”，本质上就是在这种认知模式下产生的“理所当然的错觉”。这解释了为什么改变一个核心观点如此困难——因为那意味着需要重构整个认知模式，会引发强烈的认知失调和抗拒。从社会角度看，这也能解释为什么一个时代的主流思想（如“天赋王权”）会如此根深蒂固，因为它与当时的世界观体系（如亚里士多德的“天然位置”说）是相互支撑的。\n\n**洞察2：科学进步并非简单的“知识累积”，而是“世界观革命”**\n书中对从亚里士多德到牛顿世界观的转变描述，清晰地展示了科学进步不是线性地、一个接一个地发现新事实，而是对旧有世界观的全面颠覆和重构。哥白尼体系、第谷体系、开普勒体系、伽利略的证据……每一步都不仅仅是新数据的增加，而是对“地球中心”、“完美圆周运动”、“月上区/月下区”等核心哲学性/概念性事实的挑战。这颠覆了教科书里“伽利略在比萨斜塔扔铁球证明亚里士多德错了”这种简化故事，揭示了科学革命是一场涉及天文学、物理学、哲学、宗教和社会的宏大“范式转换”（借用托马斯·库恩的术语）。这启示我们，当代的重大科学进展（如量子力学、演化论）可能正在引发一场同样深刻的、对我们现有世界观的革命。\n\n**洞察3：工具主义与现实主义的选择，反映了人类对“确定性”的追求与妥协**\n工具主义和现实主义之争，本质上是关于“科学到底能告诉我们什么”的哲学争论。现实主义代表了人类对世界“终极真相”的渴望，希望理论能揭示实在；而工具主义则是一种务实的妥协，承认我们的理论可能只是有用的“模型”，而非“真相”。这种张力不仅存在于科学中，也存在于生活的方方面面。例如，经济学模型（如理性人假设）是工具主义的，它有助于预测市场行为，但未必描述真实的人性。心理学中的“自我效能感”概念，从工具主义角度看，它作为一个有用的“虚构”来激励行动，远比纠结它是否是一个真实的“心理实体”更重要。认识到这种区分，能让我们对任何理论（无论是科学理论还是生活哲学）都保持一种健康的、批判性的谦逊。\n\n## 第四层：个人思考与应用\n\n**行动建议1：建立你的“观点拼图”地图**\n读完本书后，尝试画一张你自己的“核心观点拼图”。写下你目前认为绝对正确的几个核心信念（比如“努力就会成功”、“时间是绝对的”、“人是理性的”）。然后，思考支持这些核心信念的其他观点是什么？如果有一天，你发现其中一个核心信念是错的（例如，通过某个经历发现“努力不一定成功”），你的整个“拼图”会受到多大冲击？你需要调整哪些相关观点？这个练习能让你更清晰地意识到自己世界观的边界和潜在脆弱性。\n\n**行动建议2：区分你生活中的“经验事实”和“哲学性/概念性事实”**\n当与他人争论或面对一个新观点时，练习区分哪些是可以通过数据或观察直接验证的“经验事实”，哪些是你基于自身价值体系或长期信念而认为“理所当然”的“哲学性/概念性事实”。例如，在讨论“人工智能是否会取代人类工作”时，“AI在某些领域效率更高”是经验事实；而“人类有独特价值，所以不会被取代”则更接近一个哲学性/概念性事实。意识到后者的存在，能让你更容易理解为什么别人会持有与你完全不同的观点，从而减少无谓的争论。\n\n**行动建议3：在决策中应用“工具主义”思维，减少对“绝对真理”的执念**\n在工作和生活中，不必总是追求一个“唯一正确”的答案或理论。当面临复杂问题时，可以尝试问自己：“哪个假设或模型，即使它不是完全真实的，但作为一个有用的工具，能帮助我做出更好的决策？”例如，在制定项目计划时，不必纠结于“人性本善还是本恶”的哲学问题，而是可以工具性地假设“大多数人在有明确目标和激励时会努力工作”，并以此为基础设计管理流程。这种思维方式能让你更灵活、更高效地应对不确定性。\n\n**行动建议4：主动寻找并理解“异常现象”，作为检验你世界观的试金石**\n书中提到，异常数据是推动世界观转变的关键。在你的专业领域或日常生活中，刻意寻找那些与你的常规认知相矛盾的现象或观点。不要急于否定它们，而是把它们当作检验你现有“世界观拼图”稳固性的试金石。例如，如果你坚信“市场是有效的”，就去研究一下行为金融学中关于“非理性繁荣”的案例。这些“异常现象”可能不会立即推翻你的世界观，但会迫使你思考如何调整你的拼图，使其更具包容性和解释力。"

    "fourLayerNotes": "# 《11/22/63》- 四层笔记\n\n## 第一层：基础信息\n- **书名**：11/22/63\n- **作者**：(美)斯蒂芬·金\n- **核心主题**：通过一位普通教师穿越时空试图阻止肯尼迪遇刺的故事，探讨命运、因果与选择的不可逆性，以及过去是否真的值得被改变。\n- **适合人群**：喜欢历史悬疑、时间旅行题材的读者；对肯尼迪遇刺案有好奇心的历史爱好者；以及任何思考“如果我能回到过去改变一件事”这一命题的人。\n\n## 第二层：核心内容总结\n\n**要点1：时间旅行并非童话，过去有强大的“纠错”机制**\n书中通过阿尔·坦普尔顿的发现揭示：时间旅行是可能的，但过去并不愿意被改变。当主角杰克·埃平试图改变历史时，他会遭遇各种阻力——从身体不适到意外事件，仿佛时间本身在抵抗。阿尔本人因多次穿越而迅速衰老、生病，说明干预过去需要付出巨大的个人代价。\n\n**要点2：普通人也能成为历史的见证者与干预者**\n杰克·埃平并非英雄或学者，他只是一个离异、情感内敛的高中英语教师。他的平凡性恰恰是故事的核心：历史不是由伟人独自书写的，而是由无数普通人的选择与行动共同塑造。他因一篇学生作文（守门人哈里·邓宁关于父亲杀全家的真实经历）而流泪，这眼泪最终促使他同意参与穿越计划。\n\n**要点3：情感阻滞并非无情，而是另一种深沉的感知方式**\n杰克的前妻指责他“缺乏情感梯度”，但书中通过他对哈里作文的哭泣、对父母去世的私下哀悼，以及最终面对改变历史后果时的挣扎，证明情感可以深沉而私密。真正的勇气不是没有恐惧或悲伤，而是在感受一切后依然选择行动。\n\n**要点4：过去是“有机体”，改变它可能带来更坏的后果**\n阿尔警告杰克：“过去是固执的，它不想被改变。”书中暗示，即使成功阻止肯尼迪遇刺，也可能引发连锁反应——比如更糟糕的冷战结局或社会动荡。这呼应了“蝴蝶效应”理论：微小的改变可能在时空中放大为灾难。\n\n**要点5：时间旅行的终点不是拯救世界，而是拯救一个具体的人**\n杰克最初的目标是阻止肯尼迪遇刺，但在穿越过程中，他逐渐发现真正驱动他的是拯救他人——尤其是他深爱的萨迪·邓希尔，以及那个写出震撼作文的守门人哈里·邓宁。最终，他不得不面对一个残酷的选择：改变历史拯救一个人，还是让历史保持原样。\n\n## 第三层：深度洞察与跨学科联系\n\n**洞察1：心理学视角——情感记忆与创伤的“时间性”**\n杰克对哈里作文的强烈反应，揭示了一个心理学现象：创伤记忆往往以非线性的方式影响人。哈里的作文不是简单的叙述，而是通过细节（“血涌向喉咙”、“我喜欢她摘花”）重建了情感现场，这种“情感真实”比客观事实更能触动他人。这也解释了为什么杰克愿意为这个陌生人冒险：因为哈里的故事激活了他自己压抑的情感记忆。\n\n**洞察2：历史学与哲学——偶然性与必然性的边界**\n书中反复出现的主题是“人生就像一枚不停转动的硬币”，强调历史的偶然性。但另一方面，阿尔和杰克都发现，某些事件似乎“注定”会发生（如肯尼迪遇刺）。这引发了哲学思考：历史是无数偶然性的随机碰撞，还是存在某种隐含的必然结构？斯蒂芬·金没有给出答案，但通过杰克的旅程，他让读者亲身体验这种张力。\n\n**洞察3：社会学视角——普通人的历史力量**\n传统历史叙事常聚焦于总统、将军等大人物，但本书强调：守门人、教师、餐馆老板——这些“小人物”的日常选择同样在塑造历史。哈里·邓宁的作文不仅改变了杰克的人生，还间接影响了时间旅行的走向。这提醒我们，历史不是由英雄独白构成的，而是由无数个“杰克”和“哈里”的对话与行动编织而成。\n\n## 第四层：个人思考与应用\n\n**行动建议1：记录并珍视“改变你生活的一天”**\n杰克通过批改学生作文而人生转折。建议读者定期（如每月一次）写下“改变我生活的一天”，哪怕只是微小的事件。这不仅能训练观察力，还能帮助你发现自己生命中的“分水岭时刻”，从而更主动地把握人生方向。\n\n**行动建议2：练习“情感诚实”而非“情感宣泄”**\n杰克的前妻误解了他的情感表达方式。书中启示：情感的价值不在于是否公开流泪，而在于是否真实面对。可以尝试：当感到悲伤或愤怒时，先问自己“我真正感受到的是什么？”而不是立即反应。这种内在的诚实往往比外在的宣泄更有力量。\n\n**行动建议3：在“改变过去”的幻想中寻找现实启示**\n与其幻想回到过去改变某个事件，不如问自己：“如果我现在能回到五年前，我会对当时的自己说什么？”然后把这个建议转化为当下的行动。例如，如果你后悔没学某门技能，现在就开始学；如果你后悔伤害了某人，现在就去道歉。时间旅行是幻想，但“现在改变”是可能的。\n\n**行动建议4：关注“边缘人”的故事**\n书中守门人哈里·邓宁、餐馆老板阿尔都是社会边缘人，但他们的故事却成为历史的关键节点。建议读者有意识地接触那些被主流忽视的人群——清洁工、保安、小店主——倾听他们的经历。你可能会发现，这些看似平凡的人生中藏着惊人的智慧或悲剧，而你的倾听本身可能就是一种改变。\n\n**思考方向：如果只能改变一件事，你会选什么？**\n本书的核心命题是：即使有能力改变历史，你也必须面对不可预测的后果。建议读者认真思考这个思想实验：如果你有一张“时间旅行票”，只能改变人生中某个具体事件（比如阻止一次争吵、挽救一个亲人），你愿意承担多大的风险？这个问题的答案，可能比任何时间旅行理论都更能揭示你真正的价值观。"

    "fourLayerNotes": "# 《11/22/63》- 四层笔记\n\n## 第一层：基础信息\n- **书名**：11/22/63\n- **作者**：(美)斯蒂芬·金\n- **核心主题**：通过一位普通教师穿越时空试图阻止肯尼迪遇刺的故事，探讨命运、因果与选择的不可逆性，以及过去是否真的值得被改变。\n- **适合人群**：喜欢历史悬疑、时间旅行题材的读者；对肯尼迪遇刺案有好奇心的历史爱好者；以及任何思考“如果我能回到过去改变一件事”这一命题的人。\n\n## 第二层：核心内容总结\n\n**要点1：时间旅行并非童话，过去有强大的“纠错”机制**\n书中通过阿尔·坦普尔顿的发现揭示：时间旅行是可能的，但过去并不愿意被改变。当主角杰克·埃平试图改变历史时，他会遭遇各种阻力——从身体不适到意外事件，仿佛时间本身在抵抗。阿尔本人因多次穿越而迅速衰老、生病，说明干预过去需要付出巨大的个人代价。\n\n**要点2：普通人也能成为历史的见证者与干预者**\n杰克·埃平并非英雄或学者，他只是一个离异、情感内敛的高中英语教师。他的平凡性恰恰是故事的核心：历史不是由伟人独自书写的，而是由无数普通人的选择与行动共同塑造。他因一篇学生作文（守门人哈里·邓宁关于父亲杀全家的真实经历）而流泪，这眼泪最终促使他同意参与穿越计划。\n\n**要点3：情感阻滞并非无情，而是另一种深沉的感知方式**\n杰克的前妻指责他“缺乏情感梯度”，但书中通过他对哈里作文的哭泣、对父母去世的私下哀悼，以及最终面对改变历史后果时的挣扎，证明情感可以深沉而私密。真正的勇气不是没有恐惧或悲伤，而是在感受一切后依然选择行动。\n\n**要点4：过去是“有机体”，改变它可能带来更坏的后果**\n阿尔警告杰克：“过去是固执的，它不想被改变。”书中暗示，即使成功阻止肯尼迪遇刺，也可能引发连锁反应——比如更糟糕的冷战结局或社会动荡。这呼应了“蝴蝶效应”理论：微小的改变可能在时空中放大为灾难。\n\n**要点5：时间旅行的终点不是拯救世界，而是拯救一个具体的人**\n杰克最初的目标是阻止肯尼迪遇刺，但在穿越过程中，他逐渐发现真正驱动他的是拯救他人——尤其是他深爱的萨迪·邓希尔，以及那个写出震撼作文的守门人哈里·邓宁。最终，他不得不面对一个残酷的选择：改变历史拯救一个人，还是让历史保持原样。\n\n## 第三层：深度洞察与跨学科联系\n\n**洞察1：心理学视角——情感记忆与创伤的“时间性”**\n杰克对哈里作文的强烈反应，揭示了一个心理学现象：创伤记忆往往以非线性的方式影响人。哈里的作文不是简单的叙述，而是通过细节（“血涌向喉咙”、“我喜欢她摘花”）重建了情感现场，这种“情感真实”比客观事实更能触动他人。这也解释了为什么杰克愿意为这个陌生人冒险：因为哈里的故事激活了他自己压抑的情感记忆。\n\n**洞察2：历史学与哲学——偶然性与必然性的边界**\n书中反复出现的主题是“人生就像一枚不停转动的硬币”，强调历史的偶然性。但另一方面，阿尔和杰克都发现，某些事件似乎“注定”会发生（如肯尼迪遇刺）。这引发了哲学思考：历史是无数偶然性的随机碰撞，还是存在某种隐含的必然结构？斯蒂芬·金没有给出答案，但通过杰克的旅程，他让读者亲身体验这种张力。\n\n**洞察3：社会学视角——普通人的历史力量**\n传统历史叙事常聚焦于总统、将军等大人物，但本书强调：守门人、教师、餐馆老板——这些“小人物”的日常选择同样在塑造历史。哈里·邓宁的作文不仅改变了杰克的人生，还间接影响了时间旅行的走向。这提醒我们，历史不是由英雄独白构成的，而是由无数个“杰克”和“哈里”的对话与行动编织而成。\n\n## 第四层：个人思考与应用\n\n**行动建议1：记录并珍视“改变你生活的一天”**\n杰克通过批改学生作文而人生转折。建议读者定期（如每月一次）写下“改变我生活的一天”，哪怕只是微小的事件。这不仅能训练观察力，还能帮助你发现自己生命中的“分水岭时刻”，从而更主动地把握人生方向。\n\n**行动建议2：练习“情感诚实”而非“情感宣泄”**\n杰克的前妻误解了他的情感表达方式。书中启示：情感的价值不在于是否公开流泪，而在于是否真实面对。可以尝试：当感到悲伤或愤怒时，先问自己“我真正感受到的是什么？”而不是立即反应。这种内在的诚实往往比外在的宣泄更有力量。\n\n**行动建议3：在“改变过去”的幻想中寻找现实启示**\n与其幻想回到过去改变某个事件，不如问自己：“如果我现在能回到五年前，我会对当时的自己说什么？”然后把这个建议转化为当下的行动。例如，如果你后悔没学某门技能，现在就开始学；如果你后悔伤害了某人，现在就去道歉。时间旅行是幻想，但“现在改变”是可能的。\n\n**行动建议4：关注“边缘人”的故事**\n书中守门人哈里·邓宁、餐馆老板阿尔都是社会边缘人，但他们的故事却成为历史的关键节点。建议读者有意识地接触那些被主流忽视的人群——清洁工、保安、小店主——倾听他们的经历。你可能会发现，这些看似平凡的人生中藏着惊人的智慧或悲剧，而你的倾听本身可能就是一种改变。\n\n**思考方向：如果只能改变一件事，你会选什么？**\n本书的核心命题是：即使有能力改变历史，你也必须面对不可预测的后果。建议读者认真思考这个思想实验：如果你有一张“时间旅行票”，只能改变人生中某个具体事件（比如阻止一次争吵、挽救一个亲人），你愿意承担多大的风险？这个问题的答案，可能比任何时间旅行理论都更能揭示你真正的价值观。"

/* ---- 搜索 ---- */
var searchBox = document.getElementById("search-box");
var searchResults = document.getElementById("search-results");

searchBox.addEventListener("input", function(){
  var q = this.value.trim().toLowerCase();
  if(!q) { searchResults.style.display="none"; return; }
  var combined = SEARCH_DATA.concat(CONCEPT_SEARCH.map(function(c){ return {id:c,label:c,type:"concept"}; }));
  var matches = combined.filter(function(d){ return d.label.toLowerCase().indexOf(q)>-1; }).slice(0,12);
  if(!matches.length) { searchResults.style.display="none"; return; }
  searchResults.innerHTML = matches.map(function(d){
    return '<div class="sri" data-id="'+d.id+'">'+d.label+'</div>';
  }).join("");
  searchResults.style.display="block";
});

searchResults.addEventListener("click", function(e){
  var el = e.target.closest(".sri");
  if(!el) return;
  highlightNode(el.getAttribute("data-id"));
  searchResults.style.display="none";
  searchBox.value="";
});

function highlightNode(id){
  svg.selectAll(".node").classed("highlight", function(d){ return d.id===id; });
  svg.selectAll(".link").classed("highlight", function(d){
    return d.source.id===id || d.target.id===id;
  });
  var nd = nodeMap.get(id);
  if(!nd) return;
  var t = d3.zoomTransform(svg.node());
  var x = -nd.x*t.k + width/2;
  var y = -nd.y*t.k + height/2;
  svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity.translate(x,y).scale(t.k));
}

    notesHtml = notesHtml.replace(/^### (.*)$/gm, '<h5>$1</h5>');
    notesHtml = notesHtml.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    notesHtml = notesHtml.replace(/^- (.*)$/gm, '<li>$1</li>');
    notesHtml = notesHtml.replace(/\n\n/g, '<br><br>');
    notesHtml = notesHtml.replace(/\n/g, '<br>');
    html += '<div class="section"><div class="section-title">📚 四层笔记</div><div class="four-layer-notes">' + notesHtml + '</div></div>';
  }

  /* 打开原文件：用 Obsidian URI 协议，避免浏览器 file:// 限制 */
  if(d.path){
    var obsidianUrl = "obsidian://open?path=" + encodeURIComponent(d.path);
    html += '<div class="section"><a class="open-link" href="' + obsidianUrl + '">📂 在 Obsidian 中打开</a></div>';
  }

  body.innerHTML = html;
  panel.classList.add("open");
}

function closeDetail(){
  document.getElementById("detail-panel").classList.remove("open");
}

function escapeHtml(s){
  if(!s) return "";
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ---- D3 力导向图 ---- */
var width  = window.innerWidth;
var height = window.innerHeight - 48;
var svg = d3.select("#graph").append("svg").attr("width",width).attr("height",height);
var g = svg.append("g");
var zoom = d3.zoom().scaleExtent([0.05,5]).on("zoom", function(e){ g.attr("transform", e.transform); });
svg.call(zoom);

var simulation = d3.forceSimulation(NODES)
  .force("link",    d3.forceLink(LINKS).id(function(d){ return d.id; }).distance(90))
  .force("charge",  d3.forceManyBody().strength(-220))
  .force("center",  d3.forceCenter(width/2, height/2))
  .force("collision", d3.forceCollide(30))
  .force("x",       d3.forceX(width/2).strength(0.06))
  .force("y",       d3.forceY(height/2).strength(0.06));

var link = g.append("g").attr("class","links").selectAll("line")
  .data(LINKS).join("line")
  .attr("class", function(d){ return "link" + ((d.type==="book-book") ? " link-book" : ""); });

var node = g.append("g").attr("class","nodes").selectAll("g")
  .data(NODES).join("g")
  .attr("class","node")
  .attr("data-id", function(d){ return d.id; })
  .call(d3.drag()
    .on("start", function(event,d){ if(!event.active) simulation.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag",  function(event,d){ d.fx=event.x; d.fy=event.y; })
    .on("end",   function(event,d){ if(!event.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; }));

node.append("circle")
  .attr("r", function(d){ return d.type==="book" ? 5+Math.sqrt(d.degree||1)*1.5 : 7; })
  .attr("fill", function(d){ return d.type==="book" ? (CLUSTER_COLORS[d.cluster]||"#94a3b8") : "#f97316"; })
  .attr("stroke", function(d){ return d.type==="book" ? "#0f172a" : "#d97706"; })
  .on("mouseover", function(event,d){
    var html = d.type==="book"
      ? "<strong>📖 "+d.label+"</strong><br>连通度:"+d.degree+"<br>聚类:"+(d.cluster||"未分类")
      : "<strong>💡 "+d.concept+"</strong><br>关联:"+d.book_count+" 篇";
    d3.select("#tooltip").html(html).style("opacity",1)
      .style("left",(event.pageX+12)+"px").style("top",(event.pageY-8)+"px");
  })
  .on("mouseout", function(){ d3.select("#tooltip").style("opacity",0); })
  .on("click", function(event,d){
    event.stopPropagation();
    showDetail(d);
  });

node.append("text").attr("dx",11).attr("dy","0.35em").text(function(d){ return d.label; });

var nodeMap = new Map();
simulation.on("tick", function(){
  link
    .attr("x1", function(d){ return d.source.x; })
    .attr("y1", function(d){ return d.source.y; })
    .attr("x2", function(d){ return d.target.x; })
    .attr("y2", function(d){ return d.target.y; });
  node.attr("transform", function(d){
    nodeMap.set(d.id, d);
    return "translate("+d.x+","+d.y+")";
  });
});

/* ---- 图例 ---- */
var legendItems = d3.select("#legend").append("div").style("font-weight","bold").style("margin-bottom","8px").text("🎨 聚类").node().parentNode;
Object.entries(CLUSTER_COLORS).forEach(function(entry){
  var li = d3.select(legendItems).append("div").attr("class","li");
  li.append("span").attr("class","ld").style("background",entry[1]);
  li.append("span").text(entry[0]);
});

/* ---- 按钮 ---- */
var conceptVisible = true;
d3.select("#btn-toggle-concept").on("click", function(){
  conceptVisible = !conceptVisible;
  svg.selectAll(".node").filter(function(d){ return d.type==="concept"; })
    .style("display", conceptVisible?"block":"none");
  svg.selectAll(".link").filter(function(d){ return d.source.type==="concept"||d.target.type==="concept"; })
    .style("display", conceptVisible?"block":"none");
  d3.select(this).text(conceptVisible?"隐藏概念":"显示概念").classed("active",!conceptVisible);
});
d3.select("#btn-reset").on("click", function(){
  closeDetail();
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
});

svg.on("click", function(){ searchResults.style.display="none"; });
document.addEventListener("click", function(e){
  if(!document.getElementById("detail-panel").contains(e.target) && !e.target.closest(".node")){
    closeDetail();
  }
});

/* 更新统计 */
d3.select("#node-count").text(NODES.length);
d3.select("#link-count").text(LINKS.length);
</script>
</body>
</html>
